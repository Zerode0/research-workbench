<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 科研工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-panel panel">
    <span class="brand-mark">研</span>
    <h1>登录科研工作台</h1>
    <p class="muted">登录后可查看和编辑你的 Idea、概念与文献。</p>
    <form id="login-form">
      <div class="form-row">
        <label class="form-label" for="password">访问密码</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
      </div>
      <p id="login-error" class="error-text" role="alert" hidden></p>
      <button class="btn primary" type="submit">登录</button>
    </form>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
